openapi: 3.0.3
info:
  title: MealRoute Demo Venue API
  version: 0.1.0
  description: |
    Контракт отдельного demo-сервиса заведения. Сервис запускается отдельным
    контейнером и взаимодействует с API основного сервиса, описанным в
    `openapi.yaml`: он публикует меню в `/partner/v1/menu`, читает изменения
    заказов из `/partner/v1/order-events` и отправляет изменения статуса обратно.

    Этот документ не дублирует API платформы. Он описывает только собственные
    endpoints demo-заведения для проверки его состояния и локального
    моделирования обработки заказов.
servers:
  - url: http://localhost:8081
    description: Локальный запуск demo-заведения
tags:
  - name: Health
    description: Проверка состояния отдельного сервиса
  - name: Venue
    description: Локальные данные и операции demo-заведения
paths:
  /v1/health:
    get:
      tags: [Health]
      summary: Проверить готовность demo-заведения
      description: Используется Docker Compose healthcheck и локальной диагностикой.
      operationId: getVenueHealth
      responses:
        '200':
          description: Сервис готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/menu:
    get:
      tags: [Venue]
      summary: Получить локальный снимок меню
      description: |
        Возвращает меню из локального источника demo-заведения. При старте или
        изменении меню venue-сервис отправляет этот снимок в основной сервис
        через `PUT /partner/v1/menu`.
      operationId: getLocalMenu
      responses:
        '200':
          description: Локальное меню
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueMenu'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/orders:
    get:
      tags: [Venue]
      summary: Получить локальные заказы
      description: |
        Возвращает заказы, которые demo-заведение идемпотентно применило из
        `GET /partner/v1/order-events`. Это локальный read-модельный endpoint
        для демонстрации и проверки интеграции. Используется непрозрачная
        keyset-пагинация по `(createdAt, venueOrderId)` в обратном порядке;
        cursor привязан к фильтру `status`, а `nextCursor` возвращается только
        при наличии следующей страницы.
      operationId: listLocalOrders
      parameters:
        - $ref: '#/components/parameters/OrderStatus'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница локальных заказов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/orders/{venueOrderId}:
    get:
      tags: [Venue]
      summary: Получить локальный заказ
      description: Локальная read-модель заказа и его сопоставление с заказом платформы.
      operationId: getLocalOrder
      parameters:
        - $ref: '#/components/parameters/VenueOrderId'
      responses:
        '200':
          description: Локальный заказ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueOrder'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /v1/orders/{venueOrderId}/status:
    post:
      tags: [Venue]
      summary: Смоделировать смену статуса заказа
      description: |
        Операция demo-сервиса для имитации работы кухни. Venue сначала выполняет
        идемпотентную partner-команду в platform и только после её успеха
        фиксирует статус локально. `accepted` вызывает `/accept`, `rejected` —
        `/reject`, а этапы кухни — `/status`. При недоступности platform
        локальный заказ не изменяется, и запрос можно безопасно повторить.
      operationId: updateLocalOrderStatus
      parameters:
        - $ref: '#/components/parameters/VenueOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVenueOrderStatusRequest'
      responses:
        '200':
          description: Partner-команда выполнена, статус зафиксирован локально
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VenueOrder'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Недопустимый переход статуса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    VenueOrderId:
      name: venueOrderId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    OrderStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/VenueOrderStatus'
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: Непрозрачный cursor предыдущего ответа, привязанный к фильтру status.
  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    NotFound:
      description: Локальный ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
    InternalServerError:
      description: Внутренняя ошибка demo-сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: demo-venue
        version:
          type: string
          example: 0.1.0
      additionalProperties: false

    ProblemDetails:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      additionalProperties: false

    VenueMenu:
      type: object
      required: [venueExternalId, menuVersion, currency, categories, updatedAt]
      properties:
        venueExternalId:
          type: string
          minLength: 1
          maxLength: 128
          example: demo-pizza-1
        menuVersion:
          type: integer
          format: int64
          minimum: 1
        currency:
          type: string
          enum: [RUB]
        categories:
          type: array
          items:
            $ref: '#/components/schemas/VenueMenuCategory'
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    VenueMenuCategory:
      type: object
      required: [externalCategoryId, name, items]
      properties:
        externalCategoryId:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 120
        sortOrder:
          type: integer
          format: int32
          default: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/VenueMenuItem'
      additionalProperties: false

    VenueMenuItem:
      type: object
      required: [externalItemId, name, price, available]
      properties:
        externalItemId:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
          maxLength: 2000
        price:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean
        sortOrder:
          type: integer
          format: int32
          default: 0
      additionalProperties: false

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000000
          description: Сумма в копейках.
        currency:
          type: string
          enum: [RUB]
      additionalProperties: false

    VenueOrderPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VenueOrder'
        nextCursor:
          type: string
          nullable: true
          description: Cursor следующей страницы; `null`, если данных больше нет.
      additionalProperties: false

    VenueOrder:
      type: object
      required:
        - venueOrderId
        - platformOrderId
        - status
        - items
        - total
        - createdAt
        - updatedAt
      properties:
        venueOrderId:
          type: string
          minLength: 1
          maxLength: 128
        platformOrderId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/VenueOrderStatus'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/VenueOrderItem'
        total:
          $ref: '#/components/schemas/Money'
        rejectionReason:
          type: string
          nullable: true
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    VenueCommandStatus:
      type: string
      description: Статусы, которые оператор demo-заведения может отправить в platform.
      enum:
        - accepted
        - rejected
        - preparing
        - ready
        - delivering
        - delivered

    VenueOrderItem:
      type: object
      required: [externalItemId, name, quantity, unitPrice]
      properties:
        externalItemId:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 200
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
        unitPrice:
          $ref: '#/components/schemas/Money'
      additionalProperties: false

    VenueOrderStatus:
      type: string
      enum:
        - pending_confirmation
        - accepted
        - rejected
        - preparing
        - ready
        - delivering
        - delivered
        - cancelled

    UpdateVenueOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/VenueCommandStatus'
        reason:
          type: string
          nullable: true
          minLength: 1
          maxLength: 500
          description: Допустима только при status=rejected.
      additionalProperties: false
