version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true
  allow-parallel-runners: true

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - misspell
    - nilerr
    - nolintlint
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: strict
